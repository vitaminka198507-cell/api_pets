<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f4f7fb;
            color: #1f2937;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(100%, 720px);
            text-align: center;
        }

        h1 {
            margin: 0 0 24px;
            font-size: 36px;
            line-height: 1.2;
        }

        .pet-photo {
            width: 100%;
            max-height: 70vh;
            object-fit: contain;
            display: block;
            margin: 0 auto 24px;
            border-radius: 8px;
            box-shadow: 0 16px 40px rgba(31, 41, 55, 0.16);
            background: #ffffff;
        }

        .message {
            margin: 0 0 24px;
            padding: 16px;
            border-radius: 8px;
            background: #fff7ed;
            color: #9a3412;
            font-weight: 700;
        }

        .button {
            display: inline-block;
            border: 0;
            border-radius: 8px;
            padding: 14px 22px;
            background: #2563eb;
            color: #ffffff;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .button-secondary {
            background: #10b981;
        }

        .button-secondary:hover {
            background: #059669;
        }

        .button[aria-pressed="true"] {
            outline: 3px solid rgba(37, 99, 235, 0.24);
            outline-offset: 3px;
        }

        .button-secondary[aria-pressed="true"] {
            outline-color: rgba(16, 185, 129, 0.28);
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            h1 {
                font-size: 28px;
            }

            .button {
                width: 100%;
            }

            .actions {
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>{{ title }}</h1>

        {% if error_message %}
            <p class="message">{{ error_message }}</p>
        {% endif %}

        {% if image_url %}
            <img class="pet-photo" src="{{ image_url }}" alt="{{ image_alt }}">
        {% endif %}

        <div class="actions">
            <form method="get" action="/">
                <input type="hidden" name="pet" value="dog">
                <button class="button" type="submit" aria-pressed="{{ 'true' if selected_pet == 'dog' else 'false' }}">
                    🐶 Получить собачку
                </button>
            </form>

            <form method="get" action="/">
                <input type="hidden" name="pet" value="cat">
                <button class="button button-secondary" type="submit" aria-pressed="{{ 'true' if selected_pet == 'cat' else 'false' }}">
                    🐱 Получить котика
                </button>
            </form>
        </div>
    </main>
</body>
</html>
